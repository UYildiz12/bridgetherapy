name: CI

on:
  push:
    branches: [master, main, architecture-redesign]
  pull_request:

jobs:
  web:
    name: Web + API checks
    runs-on: ubuntu-latest
    # Placeholder values let Prisma, Next.js, and env validation load without
    # connecting to external services. Tests mock Supabase and Prisma calls.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      AI_key: ci-google-ai-key
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@10.x).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @exhale/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @exhale/db validate

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Audit dependencies
        run: pnpm audit --audit-level low
