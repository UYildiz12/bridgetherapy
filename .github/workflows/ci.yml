name: CI

on:
  push:
    branches: [master, main, architecture-redesign]
  pull_request:

jobs:
  web:
    name: Web + API — typecheck & test
    runs-on: ubuntu-latest
    # Placeholder DB URLs so `prisma generate`/`validate` can resolve the datasource.
    # CI never connects to a database — tests mock Prisma and Supabase.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@10.x) — do not
      # also set `version` here, or action-setup errors on the duplicate.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @exhale/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @exhale/db validate

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test
